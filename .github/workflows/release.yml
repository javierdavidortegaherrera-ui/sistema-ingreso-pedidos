name: Preparar borrador de Release Android
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta del prototipo
        required: true
        default: v1.0.0-prototipo.1
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar etiqueta
        shell: bash
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-prototipo\.[0-9]+$ ]]'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: python3 scripts/auditar_publicacion.py
      - name: Restaurar firma estable del prototipo
        env:
          KEYSTORE_B64: ${{ secrets.PROTOTYPE_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo 'Configura PROTOTYPE_DEBUG_KEYSTORE_BASE64 con la clave del prototipo antes de compilar.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - run: flutter build apk --release
      - name: Preparar archivos
        shell: bash
        run: |
          mkdir -p dist/release
          cp build/app/outputs/flutter-apk/app-release.apk dist/release/Pedidos-Prototipo-Cliente.apk
          cp docs/LEEME-CLIENTE.txt dist/release/
          cp LICENSE docs/ATRIBUCIONES.md docs/LICENCIAS_DEPENDENCIAS.txt dist/release/
          cp assets/fonts/LICENSE-Roboto.txt dist/release/
          cd dist/release
          sha256sum Pedidos-Prototipo-Cliente.apk > SHA256.txt
      - name: Crear borrador revisable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$TAG" dist/release/* --target "$GITHUB_SHA" --draft --prerelease --title "Prototipo de ingreso de pedidos" --notes-file docs/releases/v1.0.0-prototipo.1.md
